<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jumpingNinja.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <title>Jumping Runner</title>
</head>
<body>
    <header>
        <h1>Jump Runner</h1>
        <p>Jump over obstacles and earn points!</p>
    </header>
  <main>
     <section aria-labelledby="game-heading">
        <h2 id="game-heading">Game Area</h2>
        <p>Press Spacebar or Arrrow Up to jump</p>
        <p>
            Score: <output id="score">0</output>
        </p>
        <div id="game-area" aria-label="Jump Runner playing field"></div>
        <p id="game-message" role="status">Press Start Game to begin</p>
        <button id="startBtn" type="button">Start Game</button>
        
     </section>
  </main>
  <footer>Jump Runner- Javascript Game</footer>
</body>
</html>
